[workspace]
members = [
    "crates/opacus-dex",
    "crates/opacus-crypto",
    "crates/opacus-consensus",
    "crates/opacus-light-client",
    "crates/opacus-wallet",
    "crates/opacus-network",
    "crates/opacus-node",
    "crates/opacus-bridge",
    "crates/opacus-miner",
    "crates/opacus-zk",
    "cli/opacus",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
curve25519-dalek = { version = "4.1", features = ["serde", "rand_core"] }
bip39 = { version = "3.0", features = ["zeroize"] }
blake3 = "1.5"
sha3 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.3", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
tokio = { version = "1.35", features = ["full"] }
num_cpus = "1.16"
parking_lot = "0.12"
toml = "0.8"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
