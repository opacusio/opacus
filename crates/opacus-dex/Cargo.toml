[package]
name = "opacus-dex"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "Uniswap integration for Opacus: EIP-155 tx signing, Uniswap V2 router calldata, wOPACUS helpers"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
rand = "0.8"
