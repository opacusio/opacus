name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust workspace (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-pinned, Infra-2)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned, Infra-2)
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 (SHA-pinned, Infra-2)

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests (default features)
        run: cargo test --workspace

      - name: Run opacus-zk real-prover tests
        run: cargo test -p opacus-zk --features real-prover

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  contracts:
    name: Foundry contracts (wOPACUS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-pinned, Infra-2)

      - name: Install Foundry v1.8.5 (checksum-verified, audit M-05)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLO "https://github.com/foundry-rs/foundry/releases/download/v1.8.5/foundry_v1.8.5_linux_amd64.tar.gz"
          echo "6c66ffcc55fa4249197721baa3098bc208014ea1d8aa04b2ed50ac6bccffb226  foundry_v1.8.5_linux_amd64.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf foundry_v1.8.5_linux_amd64.tar.gz -C "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Build contracts
        run: forge build --root contracts

      - name: Test contracts
        run: forge test --root contracts

  audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-pinned, Infra-2)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned, Infra-2)
      - name: Install cargo-audit (locked)
        run: cargo install cargo-audit --locked
      - name: Run cargo audit (RustSec advisories)
        run: cargo audit

  deny:
    name: cargo-deny (advisories / licenses / bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-pinned, Infra-2)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (SHA-pinned, Infra-2)
